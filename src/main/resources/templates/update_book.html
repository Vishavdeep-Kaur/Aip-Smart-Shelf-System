<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Book Details</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 600px;">
        <div class="card shadow border-0">
            <div class="card-header bg-primary text-white py-3 fw-bold">Edit book details</div>
            <div class="card-body p-4">
                <form th:action="@{/saveBook}" th:object="${book}" method="POST">
                    <!-- Hidden inputs so the system knows which row database id key to update -->
                    <input type="hidden" th:field="*{id}">
                    <input type="hidden" th:field="*{availableCopies}">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Book Title</label>
                        <input type="text" th:field="*{title}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Author Name</label>
                        <input type="text" th:field="*{author}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">ISBN Code</label>
                        <input type="text" th:field="*{isbn}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Total copies</label>
                        <input type="number" th:field="*{totalCopies}" class="form-control" min="1" required>
                    </div>
                    <hr class="my-4">
                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/}" class="btn btn-light border px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">Save changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
