<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Library Catalog</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <!-- Top Navigation Menu Bar -->
    <nav class="navbar navbar-expand navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <span class="navbar-brand fw-bold">📚 Library Management System</span>
            <div class="navbar-nav gap-2">
                <a class="nav-link active" th:href="@{/}">Books</a>
                <a class="nav-link" th:href="@{/students}">Students</a>
                <a class="nav-link" th:href="@{/loans}">Loans</a>
                <a class="nav-link text-warning fw-bold" th:href="@{/reports/overdue}">Overdue</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm border-0 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="text-secondary mb-0">Book catalog</h4>
                <a th:href="@{/showNewBookForm}" class="btn btn-success">Add book</a>
            </div>

            <!-- Search Form Engine -->
            <form th:action="@{/}" method="GET" class="row g-2 mb-4">
                <div class="col-md-9">
                    <input type="text" name="search" th:value="${searchKeyword}" placeholder="Search by title or author" class="form-control">
                </div>
                <div class="col-md-3 d-grid">
                    <button type="submit" class="btn btn-primary">Search</button>
                </div>
            </form>

            <!-- Book Inventory List Grid Table -->
            <table class="table table-hover border align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Book Title</th>
                        <th>Author Name</th>
                        <th>ISBN Code</th>
                        <th class="text-center">Total Stock</th>
                        <th class="text-center">Available Stock</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="book : ${listBooks}">
                        <td class="fw-bold text-primary" th:text="${book.title}"></td>
                        <td th:text="${book.author}"></td>
                        <td><code th:text="${book.isbn}"></code></td>
                        <td class="text-center" th:text="${book.totalCopies}"></td>
                        <td class="text-center">
                            <span th:class="${book.availableCopies > 0} ? 'badge bg-success' : 'badge bg-danger'"
                                  th:text="${book.availableCopies} + ' Available'">
                            </span>
                        </td>
                        <td class="text-center">
                            <div class="btn-group gap-1">
                                <a th:href="@{/showFormForUpdate/{id}(id=${book.id})}" class="btn btn-sm btn-outline-secondary">Edit</a>
                                <a th:href="@{/deleteBook/{id}(id=${book.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure you want to delete this book permanently?');">Delete</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
