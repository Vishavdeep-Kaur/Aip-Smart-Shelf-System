<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Library Management System | Overdue Loans</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <span class="navbar-brand fw-bold">📚 Library Management System</span>
            <div class="navbar-nav gap-2">
                <a class="nav-link" th:href="@{/}">Books</a>
                <a class="nav-link" th:href="@{/students}">Students</a>
                <a class="nav-link" th:href="@{/loans}">Loans</a>
                <a class="nav-link text-warning fw-bold active" th:href="@{/reports/overdue}">Overdue</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card border-0 shadow-sm p-4">
            <h4 class="text-danger fw-bold mb-3">⚠️ Overdue loans</h4>
            <p class="text-muted small">These books have passed their due date and have not yet been returned.</p>

            <table class="table table-hover border table-striped align-middle mt-2">
                <thead class="table-dark">
                    <tr>
                        <th>Book title</th>
                        <th>Student</th>
                        <th>Email</th>
                        <th>Due date</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="loan : ${overdueLoans}">
                        <td class="fw-bold text-danger" th:text="${loan.book.title}"></td>
                        <td class="fw-bold text-dark" th:text="${loan.student.name} + ' (' + ${loan.student.studentIdNumber} + ')'"></td>
                        <td><a th:text="${loan.student.email}" th:href="'mailto:' + ${loan.student.email}"></a></td>
                        <td class="fw-bold text-danger" th:text="${loan.dueDate}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(overdueLoans)}">
                        <td colspan="4" class="text-center text-success py-4 fw-bold">✨ No overdue loans right now.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
