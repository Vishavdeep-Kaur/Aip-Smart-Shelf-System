<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Library Management System | Loans</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <span class="navbar-brand fw-bold">📚 Library Management System</span>
            <div class="navbar-nav gap-2">
                <a class="nav-link" th:href="@{/}">Books</a>
                <a class="nav-link" th:href="@{/students}">Students</a>
                <a class="nav-link active" th:href="@{/loans}">Loans</a>
                <a class="nav-link text-warning fw-bold" th:href="@{/reports/overdue}">Overdue</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Error Alert Alert Message Bar (Zero Available Stock Constraint Check Trigger Box) -->
        <div th:if="${errorMessage}" class="alert alert-danger shadow border-start border-4 border-danger" role="alert">
            <strong class="d-block mb-1">❌ Action Aborted by System Guardrails:</strong>
            <span th:text="${errorMessage}"></span>
        </div>

        <div class="row g-4">
            <!-- Left Panel: Issue Command Terminal Input Module Form -->
            <div class="col-md-4">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-success text-white py-3 fw-bold">Issue a book</div>
                    <div class="card-body p-3">
                        <form th:action="@{/issueBook}" method="POST">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Choose a book</label>
                                <select name="bookId" class="form-select" required>
                                    <option th:each="b : ${books}" th:value="${b.id}" th:text="${b.title} + ' (' + ${b.availableCopies} + ' Left)'"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Student ID</label>
                                <input type="text" name="studentIdNumber" class="form-control" placeholder="e.g., STU-001" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Loan duration (days)</label>
                                <input type="number" name="duration" value="14" class="form-control" min="1" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100 mt-2">Issue book</button>
                        </form>
                    </div>
                </div>
            </div>
            <!-- Right Panel: Grid Ledger List Rows Table Module Matrix -->
            <div class="col-md-8">
                <div class="card shadow-sm border-0 p-3">
                    <h5 class="fw-bold mb-3">Active loans</h5>
                    <table class="table table-hover border align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Book Title</th>
                                <th>Borrower Student Name</th>
                                <th>Issue Date</th>
                                <th>Target Due Return Date</th>
                                <th class="text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="loan : ${activeLoans}">
                                <td class="fw-bold text-dark" th:text="${loan.book.title}"></td>
                                <td th:text="${loan.student.name} + ' (' + ${loan.student.studentIdNumber} + ')'"></td>
                                <td th:text="${loan.issueDate}"></td>
                                <td>
                                    <span th:class="${loan.isOverdue()} ? 'text-danger fw-bold' : 'text-success fw-bold'" th:text="${loan.dueDate}"></span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/returnBook/{id}(id=${loan.id})}" class="btn btn-sm btn-primary">Process Return</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
